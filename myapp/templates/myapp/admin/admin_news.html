{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERCLASH | Update News</title>
     <!-- Custom fonts for this template-->
     <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet" type="text/css">
     <link
         href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
         rel="stylesheet">
 
     <!-- Custom styles for this template-->
     <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet">
</head>
<body>
    {% include "myapp/admin/admin_sidebar.html" %}

    
    
    <div class="container mt-5"></div>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h6 class="m-0 font-weight-bold text-primary">ADD NEWS</h6>
                    </div>
                    <div class="card-body">
                        <form method="POST" enctype="multipart/form-data" action="{% url 'add_news' %}">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="title" class="form-label">Title</label>
                                <input type="text" class="form-control" id="title" name="title" required>
                            </div>
                            <div class="mb-3">
                                <label for="author" class="form-label">Author</label>
                                <input type="text" class="form-control" id="author" name="author" required>
                            </div>
                            <div class="mb-3">
                                <label for="date_published" class="form-label">Date Published</label>
                                <input type="date" class="form-control" id="date_published" name="date_published" required>
                            </div>
                            <div class="mb-3">
                                <label for="content" class="form-label">Content</label>
                                <textarea class="form-control" id="content" name="content" rows="4" required></textarea>
                            </div>
                            <div class="mb-3" style="position: relative; width: 100%;">
                                <label for="image" class="form-label" style=" margin-bottom: 10px;">Image Upload</label>
                                <input type="file" class="form-control" id="image" name="image" accept="image/*" required
                                       style="padding: 3px; border-radius: 5px; border: 1px solid #ccc; width: 100%; box-sizing: border-box;">
                            </div>
                            
                            <div class="mb-3">
                                <label for="url" class="form-label">URL</label>
                                <input type="url" class="form-control" id="url" name="url" placeholder="https://example.com" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Add News</button>
                        </form>
                        
    </div>
</div>

</div>
</div><hr>
<div class="container-fluid">
    <div class="row justify-content-center">
        {% if challenges %}
    <!-- Loop through challenges if there are any -->
    {% for challenge in challenges %}
        <div class="col-xl-4 col-lg-4 col-md-6 mb-4"> <!-- Adjust the column size for responsiveness -->
            <div class="card shadow mb-4">
                <!-- Card Header - Dropdown -->
                <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                    <h6 class="m-0 font-weight-bold text-primary">Title: {{ challenge.title }}</h6>
                    <div class="dropdown no-arrow">
                        <a class="dropdown-toggle" href="#" role="button" id="dropdownMenuLink"
                            data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <i class="fas fa-ellipsis-v fa-sm fa-fw text-gray-400"></i>
                        </a>
                        <div class="dropdown-menu dropdown-menu-right shadow animated--fade-in"
                            aria-labelledby="dropdownMenuLink">
                            <a class="dropdown-item" href="#" style="color:rgb(226, 70, 70)" onclick="deleteCanvasState({{ challenge.id }})">Remove News</a>
                        </div>
                    </div>
                </div>
                <!-- Card Body -->
                <div class="card-body">
                    <!-- Display the image associated with the BlogPost -->
                    <img src="{{ challenge.image.url }}" alt="Blog image" class="img-fluid"> <!-- Displaying the image -->
                </div>
            </div>
        </div>
    {% endfor %}
{% else %}
<div class="col-12">
    <div class="alert alert-info" role="alert">
        No News Published.
    </div>
</div>
{% endif %}

    </div>
</div>
</div>

</body>
<script>
    function deleteCanvasState(challengeId) {
        if (confirm("Are you sure you want to remove this news?")) {
            window.location.href = `/remove_news/${challengeId}/`;  // Redirect to the delete URL
        }
    }
</script>
<script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>

    <!-- Core plugin JavaScript-->
    <script src="{% static 'vendor/jquery-easing/jquery.easing.min.js' %}"></script>

    <!-- Custom scripts for all pages-->
    <script src="{% static 'js/sb-admin-2.min.js' %}"></script>

    <!-- Page level plugins -->
    <script src="{% static 'vendor/chart.js/Chart.min.js' %}"></script>

    <!-- Page level custom scripts -->
  
    <script src="{% static 'js/demo/chart-pie-demo.js' %}"></script>
</html>
