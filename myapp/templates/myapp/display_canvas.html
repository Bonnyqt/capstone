        document.getElementById('removeBtn').addEventListener('click', () => {
    const selectedNode = document.querySelector('.node.selected');

    if (selectedNode) {
        const nodeId = selectedNode.getAttribute('id');
        const nodeTitle = selectedNode.nextSibling; // Assuming the title follows the node in DOM
        const iconClass = selectedNode.querySelector('i').className;
        const tooltip = selectedNode.querySelector('.tooltip').textContent.trim();
        const ipAddress = selectedNode.querySelector('.ipAddress').textContent.trim();
        const vulnerability = selectedNode.querySelector('.vulnerability').textContent.trim();
        const title = nodeTitle ? nodeTitle.textContent.trim() : 'Untitled';

        // Remove all wires connected to the node
        document.querySelectorAll(`.wire[data-from="${nodeId}"], .wire[data-to="${nodeId}"]`).forEach((wire) => {
            wire.remove();
        });

        // Remove the wires from the wires array
        const updatedWires = wires.filter((wire) => wire.start !== nodeId && wire.end !== nodeId);
        wires.length = 0; // Clear the wires array
        wires.push(...updatedWires); // Add back the updated wires

        // Remove the node and its title
        if (nodeTitle) nodeTitle.remove();
        selectedNode.remove();

        // Add the node back to the toolbox
        const toolboxNode = document.createElement('div');
        toolboxNode.classList.add('toolbox-node');
        toolboxNode.setAttribute('draggable', 'true');
        toolboxNode.dataset.nodeId = nodeId;
        toolboxNode.innerHTML = `
            <i class="${iconClass}"></i>
            <span>${title}</span>
        `;
        toolboxNode.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('nodeId', toolboxNode.dataset.nodeId);
            toolboxNode.classList.add('dragged');
        });

        document.getElementById('toolboxNodes').appendChild(toolboxNode);

        updateWires(); // Update the connections
    } else {
        alert('Please select a node to remove.');
    }
});




document.getElementById('submitBtn').addEventListener('click', function () {
    const userWires = JSON.stringify(wires); // Get the wires drawn by the user
    const canvasExp = document.getElementById('canvasExp').value; // Get the explanation from the textarea

    // Check if userWires is empty or undefined
    if (!wires || wires.length === 0) {
        alert('You must draw wires before submitting!');
        return; // Stop further execution
    }

    // Check if the explanation is empty
    if (!canvasExp.trim()) {
        alert('You must provide an explanation for your network simulation!');
        return; // Stop further execution
    }

    // Assuming you have the canvas state id or any other identifier for the CanvasState
    const canvasStateId = {{ canvas_state.canvas_id }};
    
    // Send the data to the backend using AJAX
    fetch('/submit_score/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken, // You should pass CSRF token if you're using Django
        },
        body: JSON.stringify({
            canvas_state_id: canvasStateId,
            user_wires: userWires,
            canvas_explanation: canvasExp, // Include the explanation
        }),
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert('Submission successful!');
            
            // Trigger the simulation animation after successful submission
            animatePacket();

            // Show the control buttons after the successful submission
            document.querySelector('.hidden-controls').style.display = 'block';

            // Show the Exit button and hide the Submit button
            document.getElementById('exitBtn').classList.remove('hidden');
            document.getElementById('submitBtn').style.display = 'none';

            // Hide the canvas explanation textarea after submission
            document.getElementById('canvasExp').style.display = 'none';
        } else {
            alert('There was an error with your submission.');
        }
    })
    .catch(error => console.error('Error:', error));
});







        
      
        // Function to draw a wire
        function drawWire(startX, startY, endX, endY) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', startX);
            line.setAttribute('y1', startY);
            line.setAttribute('x2', endX);
            line.setAttribute('y2', endY);
            line.classList.add('wire');
            svgCanvas.appendChild(line);
        }
    
        // Add nodes to toolbox
        nodes.forEach((nodeData, index) => {
            createToolboxNode(nodeData.iconClass, nodeData.title, index);
        });
    
        // Function to create a node in the toolbox
        function createToolboxNode(iconClass, title, index) {
            const node = document.createElement('div');
            node.classList.add('toolbox-node');
            node.setAttribute('draggable', 'true');
            node.dataset.nodeId = `node-${index}`;
            node.innerHTML = `
                <i class="${iconClass}"></i>
                <span>${title}</span>
            `;
            node.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('nodeId', node.dataset.nodeId);
                node.classList.add('dragged');
            });
    
            toolboxNodes.appendChild(node);
        }
    
        // Add drop functionality to the canvas
        canvas.addEventListener('dragover', (e) => e.preventDefault());
        canvas.addEventListener('drop', (e) => {
            e.preventDefault();
            const nodeId = e.dataTransfer.getData('nodeId');
            const nodeIndex = nodeId.split('-')[1];
            const nodeData = nodes[nodeIndex];
    
            const toolboxNode = document.querySelector(`[data-node-id="${nodeId}"]`);
            if (toolboxNode) toolboxNode.remove();
    
            const canvasRect = canvas.getBoundingClientRect();
            const left = `${e.clientX - canvasRect.left}px`;
            const top = `${e.clientY - canvasRect.top}px`;
    
            addNode(nodeData.iconClass, nodeData.ipAddress, nodeData.tooltip, nodeData.vulnerability, nodeData.title, left, top, nodeIndex);
        });
    
        // Function to add a node to the canvas
        function addNode(iconClass, ipAddress, tooltip, vulnerability, title, left, top, index) {
            const node = document.createElement('div');
            node.classList.add('node');
            node.id = `node-${index}`;
            node.style.left = left;
            node.style.top = top;
            node.innerHTML = `
                <i class="${iconClass}"></i>
                <div class="tooltip">
                    ${tooltip}
                    <div class="info-row">
                        <div class="vulnerability">${vulnerability}</div>
                        <div class="ipAddress">${ipAddress}</div>
                    </div>
                </div>
            `;
    
            const nodeTitle = document.createElement('div');
            nodeTitle.classList.add('node-title');
            nodeTitle.textContent = title;
            nodeTitle.style.position = 'absolute';
            nodeTitle.style.left = left;
            nodeTitle.style.top = `calc(${top} + 50px)`;
            nodeTitle.style.textAlign = 'center';
            nodeTitle.style.fontSize = '12px';
            nodeTitle.style.width = '100px';
            nodeTitle.style.transform = 'translateX(-24%)';
    
            canvas.appendChild(node);
            canvas.appendChild(nodeTitle);
            makeNodeDraggable(node, nodeTitle);
        }
    
        // Function to make nodes draggable
        function makeNodeDraggable(node, nodeTitle) {
    let offsetX, offsetY;

    // Add click handler to allow node selection
    node.addEventListener('click', (e) => {
        e.stopPropagation(); // Prevent triggering other click handlers

        // Toggle the "selected" class
        const isSelected = node.classList.contains('selected');
        document.querySelectorAll('.node').forEach((n) => n.classList.remove('selected')); // Deselect others
        if (!isSelected) {
            node.classList.add('selected'); // Select current node
        }
    });

    // Add drag handler
    node.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const canvasRect = canvas.getBoundingClientRect();
        offsetX = e.clientX - node.getBoundingClientRect().left;
        offsetY = e.clientY - node.getBoundingClientRect().top;
        node.style.cursor = 'grabbing';

        const moveNode = (event) => {
            let newLeft = event.clientX - offsetX - canvasRect.left;
            let newTop = event.clientY - offsetY - canvasRect.top;

            newLeft = Math.max(0, Math.min(newLeft, canvasRect.width - node.offsetWidth));
            newTop = Math.max(0, Math.min(newTop, canvasRect.height - node.offsetHeight));

            node.style.left = `${newLeft}px`;
            node.style.top = `${newTop}px`;

            nodeTitle.style.left = `${newLeft}px`;
            nodeTitle.style.top = `${newTop + node.offsetHeight + 2}px`;

            updateWires();
        };

        const stopMove = () => {
            document.removeEventListener('mousemove', moveNode);
            document.removeEventListener('mouseup', stopMove);
            node.style.cursor = 'grab';
        };

        document.addEventListener('mousemove', moveNode);
        document.addEventListener('mouseup', stopMove);
    });
}


    
        // Function to update wires dynamically
        function updateWires() {
            svgCanvas.innerHTML = '';
            wires.forEach(({ start, end }) => {
                const startNode = document.getElementById(start);

                if (startNode && endNode) {

                    const startY = parseInt(startNode.style.top) + startNode.offsetHeight / 2;
                    const endX = parseInt(endNode.style.left) + endNode.offsetWidth / 2;
                    const endY = parseInt(endNode.style.top) + endNode.offsetHeight / 2;
    
                    drawWire(startX, startY, endX, endY);
                }
            });
        }

                }

        });
    } else {
        addWireBtn.textContent = 'Connect Nodes';  // Reset button text when toggled off
        addWireBtn.style.backgroundColor = '';     // Reset button color to original
        addWireBtn.style.color = '';                // Reset text color to original

        wireStart = null;  // Reset the wire selection
        const nodes = document.querySelectorAll('.node');
        nodes.forEach((node) => {

        });

});

    let animationFrameId = null; // Store the animation frame ID for canceling
let animationInProgress = false; // Track if animation is in progress
let currentWireIndex = 0; // Track current wire for simulation state
let fastForward = false; // Flag to track fast-forward mode

// Function to animate the packet
function animatePacket() {
    if (!Array.isArray(wires) || wires.length === 0) {
        alert('No wires connected. Please create connections first.');
        return;  // Exit early if no wires are defined
    }

    const packetElement = document.getElementById('packet');
    let wireIndex = currentWireIndex; // Continue from last wire index if paused

    // Function to move the packet along a single wire
    function movePacket(wire) {
        const startNode = document.getElementById(wire.start);
        const endNode = document.getElementById(wire.end);

        // Check if the wire has valid start and end nodes
        if (!startNode || !endNode) {
            alert(`Connect the nodes first.`);
            return;
        }

        const startX = parseInt(startNode.style.left) + startNode.offsetWidth / 2;
        const startY = parseInt(startNode.style.top) + startNode.offsetHeight / 2;
        const endX = parseInt(endNode.style.left) + endNode.offsetWidth / 2;
        const endY = parseInt(endNode.style.top) + endNode.offsetHeight / 2;

        packetElement.style.left = `${startX}px`;
        packetElement.style.top = `${startY}px`;
        packetElement.style.display = 'block';

        // Function to display the tooltip
        function showTooltip(node) {
            const tooltip = node.querySelector('.tooltip');
            if (tooltip) {
                tooltip.style.visibility = 'visible';
                tooltip.style.opacity = '1';

                setTimeout(() => {
                    tooltip.style.visibility = 'hidden';
                    tooltip.style.opacity = '0';
                }, 1000); // Tooltip visible for 1 second
            }
        }

        // Show tooltip for the start node
        showTooltip(startNode);

        // Wait for 1 second at the start node before starting the animation
        setTimeout(() => {
            const duration = fastForward ? 500 : 2000; // If fast-forward is true, animate faster
            const startTime = performance.now();

            function animate(timestamp) {
                if (!animationInProgress) return; // Stop if animation is canceled

                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Interpolate packet position
                const currentX = startX + progress * (endX - startX);
                const currentY = startY + progress * (endY - startY);

                packetElement.style.left = `${currentX}px`;
                packetElement.style.top = `${currentY}px`;

                if (progress < 1) {
                    animationFrameId = requestAnimationFrame(animate); // Keep animating
                } else {
                    // Show tooltip for the end node
                    showTooltip(endNode);

                    // Move to the next wire
                    wireIndex++;
                    if (wireIndex < wires.length) {
                        setTimeout(() => movePacket(wires[wireIndex]), fastForward ? 1000 : 2000); 
                    } else {
                        // End animation
                        packetElement.style.display = 'none';
                    }
                }
            }

            animationFrameId = requestAnimationFrame(animate); // Start animation
        }, 2000); // Wait for 1 second at the start node before animation starts
    }

    // Start animating from the first user-defined wire
    movePacket(wires[wireIndex]);
    animationInProgress = true;
    currentWireIndex = wireIndex; // Update to the current wire index for resume
}

// Function to stop the animation
function stopAnimation() {
    if (animationFrameId !== null) {
        cancelAnimationFrame(animationFrameId); // Stop the animation
        animationFrameId = null; // Reset the animation frame ID
    }

    // Hide the packet element
    const packetElement = document.getElementById('packet');
    packetElement.style.display = 'none';

    // Fix the tooltip in a visible state
    const allTooltips = document.querySelectorAll('.tooltip');
    allTooltips.forEach(tooltip => {
        tooltip.style.visibility = 'visible'; // Keep it visible
        tooltip.style.opacity = '1'; // Full opacity
    });

    animationInProgress = false; // Mark animation as stopped
}

// Function to resume the animation when the play button is clicked
function resumeAnimation() {
    animationInProgress = true;
    animatePacket(); // Resume animation where it was stopped
}

// Function to toggle the fast-forward mode
function toggleFastForward() {
    fastForward = !fastForward; // Toggle fast-forward mode

    // Change the button color to indicate fast-forward mode is on
    if (fastForward) {
        fastForwardBtn.style.backgroundColor = '#ff5733'; // Change to an active color (orange-red)
        fastForwardBtn.style.color = 'white'; // Change text color to white for better visibility
    } else {
        fastForwardBtn.style.backgroundColor = '#6c757d'; // Change back to default color (grey)
        fastForwardBtn.style.color = 'white'; // Reset text color
    }
}

// Attach event listener to Demonstrate button (play/pause functionality)
playPauseBtn.addEventListener('click', function() {
    if (animationInProgress) {
        stopAnimation(); // Stop if playing
    } else {
        resumeAnimation(); // Resume if paused
    }
});

// Attach event listener to Stop button
const stopBtn = document.getElementById('stopBtn');
pauseBtn.addEventListener('click', stopAnimation);

// Attach event listener to Fast Forward button
const fastForwardBtn = document.getElementById('fastForwardBtn');
fastForwardBtn.addEventListener('click', toggleFastForward);
