    <script>
        const myCanvasState = {{ canvas_state|safe }};
        const nodes = myCanvasState.nodes;
        const wires = myCanvasState.wires;
        const packet = document.getElementById('packet');
    
        nodes.forEach((nodeData, index) => {
            addNode(nodeData.iconClass, nodeData.ipAddress, nodeData.tooltip, nodeData.vulnerability, nodeData.title, nodeData.left, nodeData.top, index);
        });
        wires.forEach(wireData => {

        function addNode(iconClass, ipAddress, tooltipDescription, vulnerability, title, left, top, index) {
    // Create the node container
    let node = document.createElement('div');
    node.classList.add('node');
    const nodeId = `node-${index}`; // Create a dynamic ID based on the index
    node.id = nodeId; // Set the ID
    node.classList.add(nodeId); // Add the class name based on the ID
    node.style.left = left;
    node.style.top = top;

    node.innerHTML = `
        <i class="${iconClass}"></i>
        <div class="tooltip">
            ${tooltipDescription}
            <div class="info-row">
                <div class="vulnerability">${vulnerability}</div>
                <div class="ipAddress">${ipAddress}</div>
            </div>
        </div>
    `;

    // Append the node to the canvas
    const canvas = document.getElementById('canvas');
    canvas.appendChild(node);

    // Create the title element as a sibling to the node
    let nodeTitle = document.createElement('div');
    nodeTitle.classList.add('node-title');
    nodeTitle.textContent = title;

    // Position the title element below the node
    nodeTitle.style.position = 'absolute';
    nodeTitle.style.left = left;
    nodeTitle.style.top = `calc(${top} + 50px)`; // Adjust "50px" based on your node's height
    nodeTitle.style.textAlign = 'center';
    nodeTitle.style.fontSize = '12px'; // Adjust font size as needed
    nodeTitle.style.width = '100px'; // Ensure the title has some width
    nodeTitle.style.transform = 'translateX(-24%)'; // Center the title below the node

    // Append the title to the canvas
    canvas.appendChild(nodeTitle);
}

        function drawWire(startX, startY, endX, endY) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', startX);
            line.setAttribute('y1', startY);
            line.setAttribute('x2', endX);
            line.setAttribute('y2', endY);
            line.classList.add('wire'); 
            document.getElementById('svgCanvas').appendChild(line);
            const startCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            startCircle.setAttribute('cx', startX);
            startCircle.setAttribute('cy', startY);
            startCircle.classList.add('node-connection-point');
            const endCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            endCircle.setAttribute('cx', endX);
            endCircle.setAttribute('cy', endY);
            endCircle.classList.add('node-connection-point');
            document.getElementById('svgCanvas').appendChild(startCircle);
            document.getElementById('svgCanvas').appendChild(endCircle);
        }
    </script>
  <script>
    // Global Variables

// Global variable to track nodes with assigned blocks

document.addEventListener('DOMContentLoaded', () => {

    document.querySelectorAll('.node').forEach((node) => {

        node.setAttribute('data-occupied', 'false');

        node.addEventListener('dragover', (e) => {
            e.preventDefault(); // Allow drop only if unoccupied
            if (node.getAttribute('data-occupied') === 'false') {
                node.style.backgroundColor = 'grey'; // Change color if block can be dropped
            }
        });

        node.addEventListener('dragleave', () => {
            if (node.getAttribute('data-occupied') === 'false') {
                node.style.backgroundColor = ''; // Reset color
            }
        });

        node.addEventListener('drop', (e) => {
            e.preventDefault();

            // Prevent drop if the node is already occupied
            if (node.getAttribute('data-occupied') === 'true') {
                console.warn('Node is already occupied.');
                return;
            }

            const nodeId = e.dataTransfer.getData('nodeId'); // Retrieve dragged nodeId
            draggedBlocks[nodeId] = node.id; // Track block and node it was dropped onto

            // Mark the node as occupied
            node.setAttribute('data-occupied', 'true');

            node.style.backgroundColor = 'grey'; // Indicate the block is dropped

            // Remove the block from the assessment container
            const assessmentContainer = document.getElementById('assessmentContainer');
            const blockToRemove = document.querySelector(`.assessment-block[data-node-id="${nodeId}"]`);
            if (blockToRemove) {
                assessmentContainer.removeChild(blockToRemove);
            }

            toggleSubmitButton();
        });
    });
});

    
    function createAssessmentBlock(nodeId, tooltipText) {
        if (assessedNodes.has(nodeId)) return;
        assessedNodes.add(nodeId);

        const assessmentContainer = document.getElementById('assessmentContainer');

        // Create the new assessment block
        const assessmentBlock = document.createElement('div');
        assessmentBlock.classList.add('assessment-block');
        assessmentBlock.setAttribute('data-node-id', nodeId);

        // Only show the tooltip description
        assessmentBlock.innerHTML = `
            <div class="assessment-tooltip">${tooltipText}</div>`;

        assessmentBlock.setAttribute('draggable', true);
        assessmentBlock.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('nodeId', nodeId);
        });

        // Append the new block to the container
        assessmentContainer.appendChild(assessmentBlock);

        // Randomize the order of all blocks in the container
        randomizeAssessmentBlocks(assessmentContainer);
        toggleSubmitButton();
    }

    // Function to randomize the order of blocks in the container
    function randomizeAssessmentBlocks(container) {
        // Convert container's children (NodeList) to an array
        const blocks = Array.from(container.children);

        // Shuffle the blocks array
        for (let i = blocks.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
        }

        // Clear the container and re-append the blocks in shuffled order
        container.innerHTML = '';
        blocks.forEach(block => container.appendChild(block));
    }




    let countdownTimer; // Global variable to track the countdown timer

function startCountdown(duration) {
    let countdownContainer = document.getElementById('countdownContainer');
    if (!countdownContainer) {
        countdownContainer = document.createElement('div');
        countdownContainer.id = 'countdownContainer';
        document.body.appendChild(countdownContainer);
    }

    countdownContainer.style.cssText = `
        font-size: 24px;
        color: #06152c;
        position: fixed;
        top: 10px;
        right: 10px;
        padding: 5px 10px;
        border-radius: 5px;
        background-color: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        z-index: 1000;
    `;

    let timeRemaining = duration;
    remainingTime = timeRemaining;

    const updateCountdown = () => {
        countdownContainer.textContent = `Time remaining: ${timeRemaining}s`;

        if (timeRemaining > 0) {
            timeRemaining--;
            remainingTime = timeRemaining;
            countdownTimer = setTimeout(updateCountdown, 1000); // Track the timeout ID
        } else {
            countdownContainer.textContent = 'Time is up!';
            submitBtn.disabled = true; // Disable submit button
            autoSubmitChallenge(); // Trigger auto-submit
        }
    };

    updateCountdown();
}

function autoSubmitChallenge() {
    let score = 0;
    let correctCount = 0;
    let incorrectCount = 0;

    // Remove all assessment blocks after timer expires
    const assessmentContainer = document.getElementById('assessmentContainer');
    const allAssessmentBlocks = assessmentContainer.querySelectorAll('.assessment-block');
    allAssessmentBlocks.forEach(block => {
        block.style.display = 'none'; // You can also remove the block if needed: block.remove();
    });

    // Calculate the score based on dragged blocks
    for (const nodeId in draggedBlocks) {
        const node = document.getElementById(draggedBlocks[nodeId]);

        if (draggedBlocks[nodeId] === nodeId) {
            node.style.backgroundColor = '#84a860'; // Correct
            score += 5;
            correctCount++;
        } else {
            node.style.backgroundColor = '#ed4a4a'; // Incorrect
            incorrectCount++;
        }
    }

    const multiplier = calculateMultiplier(0); // Use 0 for expired time
    score *= multiplier;

    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    fetch('{% url "save_score_defend" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
        },
        body: JSON.stringify({
            score,
            finished: true,
            category: '{{ canvas_state.category }}',
            correct_submissions: correctCount,
            incorrect_submissions: incorrectCount,
            canvas_state_title: '{{ canvas_state.title }}'
        })
    })
    .then(response => response.json())
    .then(data => {
        console.log('Score saved:', data);
        alert('Time is up! Your score has been saved automatically.');
        exitBtn.style.display = 'block'; // Show exit button
    })
    .catch(error => {
        console.error('Error saving score:', error);
        alert('An error occurred while saving your score.');
    });
}



    // Packet animation function
    const animatePacketThroughWires = () => {
    const wire = wires[currentWireIndex];
    const startNode = document.getElementById(wire.start);
    const endNode = document.getElementById(wire.end);

    // Track nodes to assess
    if (!nodesToAssess.includes(wire.start)) nodesToAssess.push(wire.start);
    if (!nodesToAssess.includes(wire.end)) nodesToAssess.push(wire.end);

    const startX = parseInt(startNode.style.left) + 25;
    const startY = parseInt(startNode.style.top) + 25;
    const endX = parseInt(endNode.style.left) + 25;
    const endY = parseInt(endNode.style.top) + 25;

    packet.style.left = `${startX}px`;
    packet.style.top = `${startY}px`;
    packet.style.display = 'block';

    const tooltipStart = startNode.querySelector('.tooltip');
    tooltipStart.style.visibility = 'visible';
    tooltipStart.style.opacity = 1;
    startNode.style.borderColor = 'red';

    setTimeout(() => {
        const distanceX = endX - startX;
        const distanceY = endY - startY;
        const duration = 3000; // Duration of animation
        const startTime = performance.now();

        function animatePacket(timestamp) {
            const elapsed = timestamp - startTime;
            const progress = Math.min(elapsed / duration, 1);

            const easing = (t) => t * (2 - t);
            const easedProgress = easing(progress);

            packet.style.left = `${startX + distanceX * easedProgress}px`;
            packet.style.top = `${startY + distanceY * easedProgress}px`;

            if (progress < 1) {
                requestAnimationFrame(animatePacket);
            } else {
                packet.style.display = 'none';
                tooltipStart.style.visibility = 'hidden';
                tooltipStart.style.opacity = 0;

                const tooltipEnd = endNode.querySelector('.tooltip');
                tooltipEnd.style.visibility = 'visible';
                tooltipEnd.style.opacity = 1;
                endNode.style.borderColor = 'red';

                setTimeout(() => {
                    tooltipEnd.style.visibility = 'hidden';
                    tooltipEnd.style.opacity = 0;
                    startNode.style.borderColor = '';
                    endNode.style.borderColor = '';

                    currentWireIndex++;

                      // After the final packet animation ends
                    if (currentWireIndex === wires.length) {
                        nodesToAssess.forEach((nodeId) => {
                            const node = document.getElementById(nodeId);
                            const tooltip = node.querySelector('.tooltip');
                            createAssessmentBlock(nodeId, tooltip.textContent);
                        });

                        submitBtn.style.display = 'block';
                        toggleSubmitButton();
                        snackbar()
                        // Get canvas time directly from the Django template and start the countdown
                        const canvasTime = parseInt("{{ canvas_state.canvas_time }}", 10);
                        const assessmentWrapper = document.getElementById('assessmentWrapper');
        if (assessmentWrapper) {
            assessmentWrapper.style.display = 'block'; // Show the entire wrapper
        }    // Ensure countdown is visible after the animation
                        startCountdown(canvasTime);
                    } else {
                        animatePacketThroughWires(); // Continue animation for the next wire
                    }
                }, 3000);
            }
        }

        requestAnimationFrame(animatePacket);
    }, 3000);
};

  x.className = "show";

  setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
}

        if (timeRemaining <= 0) return 0;
        if (timeRemaining <= 10) return 1.2;
        if (timeRemaining <= 20) return 1.6;
        if (timeRemaining <= 30) return 1.8;
        if (timeRemaining <= 40) return 2.2;
        if (timeRemaining <= 50) return 2.0;
        if (timeRemaining <= 60) return 2.4;
        if (timeRemaining <= 70) return 2.6;
        if (timeRemaining <= 80) return 2.8;
        if (timeRemaining <= 90) return 3.0;
    }

            correct_submissions: correctCount,
            incorrect_submissions: incorrectCount,
            canvas_state_title: '{{ canvas_state.title }}'
        })
    })
    .then(response => response.json())
    .then(data => {
        console.log('Score saved:', data);
        alert('Your score has been saved!');
    })
    .catch(error => {
        console.error('Error saving score:', error);
